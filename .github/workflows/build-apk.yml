name: Build TORCH Browser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Prepare Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor & Android Platform
        run: |
          npx cap init "TORCH Browser" "com.rhdevlab.torchbrowser" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Enable Full-Screen Edge-to-Edge Status Bar & Clear-Text Traffic
        run: |
          # Allow HTTP/HTTPS sites inside WebView
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          # Set transparent/dark status bar matching edge-to-edge UI
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#09090b</item>
                  <item name="android:navigationBarColor">#09090b</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:background">#09090b</item>
                  <item name="android:statusBarColor">#09090b</item>
              </style>
          </resources>
          EOF

      - name: Set Custom TORCH App Icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#09090B</color>
          </resources>
          EOF
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://android.com"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <group android:scaleX="0.52" android:scaleY="0.52" android:translateX="5.76" android:translateY="5.76">
                  <path
                      android:fillColor="#F97316"
                      android:pathData="M8.5,14.5A2.5,2.5 0 0,0 11,12c0,-1.38 -0.5,-2 -1,-3 -1.072,-2.143 -0.224,-4.054 2,-6 0.5,2.5 2,4.9 4,6.5 2,1.6 3,3.5 3,5.5a7,7 0 1,1 -14,0c0,-1.153 0.433,-2.294 1,-3a2.5,2.5 0 0,0 2.5,2.5z"/>
              </group>
          </vector>
          EOF


      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload TORCH Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: TORCH-Browser-v1.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
