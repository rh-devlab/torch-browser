name: Build TORCH Browser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Prepare Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor & Android Platform
        run: |
          npx cap init "TORCH Browser" "com.rhdevlab.torchbrowser" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Enable Full-Screen Edge-to-Edge Status Bar & Clear-Text Traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#09090b</item>
                  <item name="android:navigationBarColor">#09090b</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:background">#09090b</item>
                  <item name="android:statusBarColor">#09090b</item>
              </style>
          </resources>
          EOF

      - name: Set Custom TORCH App Icon
        run: |
          python3 -c '
          import os, zlib, struct

          def make_png(size):
              raw = bytearray()
              cx, cy = size / 2.0, size / 2.0
              r = size * 0.34
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      dx = (x - cx) / r
                      dy = (y - cy) / r
                      outer = (dx*dx + (dy - 0.15)**2 < 0.72 and dy > -0.2) or (abs(dx) < (0.85 - (0.15 - dy)*0.75) and -1.05 <= dy <= 0.15)
                      inner = (dx*dx + (dy - 0.25)**2 < 0.22 and dy > 0.0) or (abs(dx) < (0.45 - (0.25 - dy)*0.8) and -0.45 <= dy <= 0.25)
                      if inner:
                          raw.extend((254, 215, 170, 255))
                      elif outer:
                          raw.extend((249, 115, 22, 255))
                      else:
                          raw.extend((9, 9, 11, 255))
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")

          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, sz in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              png = make_png(sz)
              for fname in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  with open(f"{path}/{fname}", "wb") as f:
                      f.write(png)
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload TORCH Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: TORCH-Browser-v1.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
