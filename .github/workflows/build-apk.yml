name: Build TORCH Browser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Prepare Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor & Android Platform
        run: |
          npx cap init "TORCH Browser" "com.rhdevlab.torchbrowser" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Enable Full-Screen Edge-to-Edge Status Bar & Clear-Text Traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#09090b</item>
                  <item name="android:navigationBarColor">#09090b</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:background">#09090b</item>
                  <item name="android:statusBarColor">#09090b</item>
              </style>
          </resources>
          EOF

      - name: Set Custom TORCH App Icon
        run: |
          python3 -c '
          import os, subprocess
          subprocess.run(["pip", "install", "-q", "pillow"], check=True)
          from PIL import Image, ImageDraw

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              img = Image.new("RGBA", (size, size), (9, 9, 11, 255))
              draw = ImageDraw.Draw(img)
              cx, cy = size // 2, size // 2
              r = int(size * 0.36)
              draw.ellipse([cx - int(r*0.75), cy - int(r*0.45), cx + int(r*0.75), cy + int(r*0.95)], fill=(249, 115, 22, 255))
              draw.polygon([(cx - int(r*0.72), cy + int(r*0.1)), (cx, cy - int(r*1.15)), (cx + int(r*0.72), cy + int(r*0.1))], fill=(249, 115, 22, 255))
              draw.ellipse([cx - int(r*0.38), cy - int(r*0.1), cx + int(r*0.38), cy + int(r*0.72)], fill=(254, 215, 170, 255))
              draw.polygon([(cx - int(r*0.35), cy + int(r*0.25)), (cx, cy - int(r*0.55)), (cx + int(r*0.35), cy + int(r*0.25))], fill=(254, 215, 170, 255))
              img.save(f"{path}/ic_launcher.png")
              img.save(f"{path}/ic_launcher_round.png")
              img.save(f"{path}/ic_launcher_foreground.png")
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload TORCH Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: TORCH-Browser-v1.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
