name: Build TORCH Browser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Prepare Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor & Android Platform
        run: |
          npx cap init "TORCH Browser" "com.rhdevlab.torchbrowser" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Enable Full-Screen Edge-to-Edge Status Bar & Clear-Text Traffic
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">#09090b</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:background">#09090b</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
              </style>
          </resources>
          EOF

      - name: Install Ultimate Pro Vector TORCH App Icon
        run: |
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.png
          rm -f android/app/src/main/res/mipmap-*/ic_launcher*.webp
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#09090B</color>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://android.com"
              xmlns:aapt="http://android.com"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer Ambient Ember Glow -->
              <path android:pathData="M54,54m-34,0a34,34 0,1 1,68 0a34,34 0,1 1,-68 0">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:centerX="54"
                          android:centerY="54"
                          android:gradientRadius="34"
                          android:type="radial">
                          <item android:color="#33F97316" android:offset="0.0" />
                          <item android:color="#00F97316" android:offset="1.0" />
                      </gradient>
                  </aapt:attr>
              </path>

              <!-- Primary Sculpted TORCH Flame -->
              <path android:pathData="M56.2,26C56.2,26 69.5,36.8 69.5,51.2C69.5,61.6 62.6,70.2 54,70.2C45.4,70.2 38.5,62.3 38.5,52.8C38.5,47.2 41.2,41.8 44.8,38.2C44.2,41.6 45.6,44.4 48.2,45.2C46.8,37.8 50.8,30.2 56.2,26Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="54"
                          android:startY="26"
                          android:endX="54"
                          android:endY="70.2"
                          android:type="linear">
                          <item android:color="#FB923C" android:offset="0.0" />
                          <item android:color="#F97316" android:offset="0.55" />
                          <item android:color="#DC2626" android:offset="1.0" />
                      </gradient>
                  </aapt:attr>
              </path>

              <!-- Secondary Dynamic Side Tongue -->
              <path android:pathData="M61.8,43.5C65.4,47.2 67.2,52.1 66.2,57.4C65.1,63.5 60.1,68.2 54,68.2C58.2,65.8 60.8,61.4 60.8,56.2C60.8,51.6 59.2,47.4 61.8,43.5Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="60"
                          android:startY="43.5"
                          android:endX="60"
                          android:endY="68.2"
                          android:type="linear">
                          <item android:color="#FDBA74" android:offset="0.0" />
                          <item android:color="#EA580C" android:offset="1.0" />
                      </gradient>
                  </aapt:attr>
              </path>

              <!-- Inner White-Gold Hot Core -->
              <path android:pathData="M54.2,47.5C54.2,47.5 60.2,52.6 60.2,58.8C60.2,63.8 57.4,67.5 54,67.5C50.6,67.5 47.8,63.8 47.8,58.8C47.8,54.8 50.4,50.8 54.2,47.5Z">
                  <aapt:attr name="android:fillColor">
                      <gradient
                          android:startX="54"
                          android:startY="47.5"
                          android:endX="54"
                          android:endY="67.5"
                          android:type="linear">
                          <item android:color="#FFFBEB" android:offset="0.0" />
                          <item android:color="#FED7AA" android:offset="0.6" />
                          <item android:color="#F97316" android:offset="1.0" />
                      </gradient>
                  </aapt:attr>
              </path>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://android.com">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload TORCH Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: TORCH-Browser-Pro-v2.2
          path: android/app/build/outputs/apk/debug/app-debug.apk
