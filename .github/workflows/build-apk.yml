name: Build TORCH Browser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Prepare Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor & Android Platform
        run: |
          npx cap init "TORCH Browser" "com.rhdevlab.torchbrowser" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Enable Clear-Text Traffic & Status Bar Theme
        run: |
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/values
          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#09090b</item>
                  <item name="android:navigationBarColor">#09090b</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:background">#09090b</item>
                  <item name="android:statusBarColor">#09090b</item>
              </style>
          </resources>
          EOF

      - name: Apply Custom Uploaded icon.png to Android App
        run: |
          pip install Pillow
          python3 -c '
          import os
          from PIL import Image

          if os.path.exists("icon.png"):
              img = Image.open("icon.png").convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192
              }
              # Remove adaptive XMLs so Android uses our exact high-res PNG icons
              os.system("rm -rf android/app/src/main/res/mipmap-anydpi-v26")
              for folder, sz in sizes.items():
                  path = f"android/app/src/main/res/{folder}"
                  os.makedirs(path, exist_ok=True)
                  os.system(f"rm -f {path}/ic_launcher*.webp")
                  resized = img.resize((sz, sz), Image.Resampling.LANCZOS)
                  for fname in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                      resized.save(f"{path}/{fname}", "PNG")
              print("Successfully applied custom icon.png!")
          else:
              print("icon.png not found, keeping default.")
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload TORCH Browser APK
        uses: actions/upload-artifact@v4
        with:
          name: TORCH-Browser-Pro-v2.3
          path: android/app/build/outputs/apk/debug/app-debug.apk
